# Bootstrap HTTP only: no existing certificate needed, no API/frontend exposed here.
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    server_tokens off;
    server {
        listen 80;
        server_name next-stop-siren.duckdns.org;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            try_files $uri =404;
        }
        location / { return 503; }
    }
}
