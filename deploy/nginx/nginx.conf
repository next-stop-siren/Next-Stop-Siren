worker_processes auto;
pid /var/run/nginx.pid;
# Nginx error records may contain raw request/query credentials. Do not emit them.
# Safe access status, backend sanitized logs and explicit probes provide diagnostics.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 65;
    server {
        listen 80;
        server_name next-stop-siren.duckdns.org;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            try_files $uri =404;
        }
        location / { return 308 https://next-stop-siren.duckdns.org$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name next-stop-siren.duckdns.org;
        ssl_certificate /etc/letsencrypt/live/next-stop-siren.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/next-stop-siren.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        location ~ ^/api(?:/|$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
