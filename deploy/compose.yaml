name: next-stop-siren
services:
  nginx:
    image: ${FRONTEND_IMAGE:?Set the reviewed frontend image digest}
    platform: linux/amd64
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme-webroot:/var/www/acme:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  backend:
    image: ${BACKEND_IMAGE:?Set the reviewed backend image digest}
    platform: linux/amd64
    env_file:
      - ${RUNTIME_ENV_FILE:?Set the restricted server env file path}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Uvicorn request drain: 10s; worker poll join receives 35s, but pool wait is unbounded.
    # 60s is Compose's final stop/kill boundary, not proof of lossless worker shutdown.
    stop_grace_period: 60s
    logging: *logging
  db:
    image: postgres:17.11
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
volumes:
  db-data:
  acme-webroot:
  letsencrypt:
