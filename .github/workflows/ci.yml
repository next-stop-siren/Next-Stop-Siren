name: B7-1 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: b7-1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: B7-1 required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      TEST_DATABASE_URL: postgresql://b71_test:local_test_only_change_me@127.0.0.1:55433/b71_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.19'
          enable-cache: false
      - name: Prepare locked dependencies and example-only settings
        run: |
          node --version
          npm --version
          python --version
          uv --version
          test "$(node --version)" = 'v24.21.0'
          test "$(npm --version)" = '11.19.0'
          test "$(python --version)" = 'Python 3.13.15'
          test "$(uv --version | cut -d ' ' -f 2)" = '0.11.19'
          cp .env.example .env
          npm ci --prefix frontend
          uv sync --directory backend --locked --no-managed-python --python "$(command -v python)"
          npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Frontend and backend format, lint, and types
        run: |
          npm run format:check --prefix frontend
          npm run lint --prefix frontend
          npm run typecheck --prefix frontend
          uv run --directory backend --no-sync ruff format --check app tests scripts
          uv run --directory backend --no-sync ruff check app tests scripts
          uv run --directory backend --no-sync mypy app
      - name: Unit and automation tests
        run: |
          python -m unittest discover -s scripts -p test_local.py
          ./local.sh test-unit
      - name: Dedicated database integration and browser E2E
        run: |
          ./local.sh test-db
          ./local.sh test-e2e
      - name: Build
        run: ./local.sh build
