name: 버그
description: 재현할 수 있는 문제를 보고합니다.
title: "[버그] "
labels: []
body:
  - type: markdown
    attributes:
      value: "재현에 필요한 정보만 적고, 비밀번호·토큰·개인정보는 첨부하지 마세요."
  - type: textarea
    id: problem
    attributes:
      label: 문제 요약
      description: 어떤 상황에서 무엇이 잘못되는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 다른 사람이 같은 문제를 확인할 수 있도록 순서대로 적어 주세요.
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      description: 관련 있는 기기, 브라우저, 버전 또는 실행 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 참고 자료
      description: 오류 메시지나 화면을 첨부할 때는 비밀값과 개인정보를 가려 주세요.
    validations:
      required: false
