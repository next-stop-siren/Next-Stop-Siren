name: 작업
description: 구현, 개선 또는 문서 작업을 제안합니다.
title: "[작업] "
labels: []
body:
  - type: markdown
    attributes:
      value: "새 작업은 [작업] 뒤에 만들 결과를 설명하는 제목을 적어 주세요. 기존 팀 작업 #2–#21은 [작업] Sxx <설명 제목> 형식을 유지하며 S01–S20은 각 작업의 고정 식별자입니다. 새 이슈에 다음 S 번호를 자동으로 붙이거나 S 번호로 작업 순서를 판단하지 마세요. 한 이슈에 한 결과를 담고, 실제로 남은 PM 결정만 적어 주세요."
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 해결할 문제와 필요한 이유를 설명해 주세요.
      placeholder: 현재 상황과 기대하는 결과
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: 시작 조건
      description: 직접 선행 이슈와 공통 준비 작업을 링크하고, 필요한 PM 결정을 구분해 주세요.
      placeholder: "- 선행: #…\n- 공통 준비: …\n- PM 결정: 없음 또는 구체적인 값"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 구현 순서와 범위
      description: 담당자가 바로 시작할 수 있는 코드·문서 작업과 제외할 범위를 적어 주세요.
      placeholder: "1. …\n2. …\n제외: …"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 검토자가 결과를 확인할 수 있는 조건을 적어 주세요.
      placeholder: "- [ ] 사용자가 …할 수 있다\n- [ ] …를 확인했다"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 확인 방법
      description: 실행할 명령과 확인할 결과를 적어 주세요.
      placeholder: 실행 명령, 수동 확인 절차 또는 검토할 항목
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 남길 결과
      description: PR에 남길 코드·테스트·검사 기록을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서, 화면 또는 이슈가 있으면 링크해 주세요.
    validations:
      required: false
