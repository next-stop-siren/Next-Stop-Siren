name: 작업
description: 구현, 개선 또는 문서 작업을 제안합니다.
title: "[작업] "
labels: []
body:
  - type: markdown
    attributes:
      value: "한 이슈에 한 결과를 적어 주세요. 미정 정책은 결정 대기로 표시하세요."
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 해결할 문제와 필요한 이유를 설명해 주세요.
      placeholder: 현재 상황과 기대하는 결과
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 변경 범위
      description: 이번 이슈에서 바꿀 범위를 적어 주세요.
      placeholder: "포함: …\n제외: …"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 검토자가 결과를 확인할 수 있는 조건을 적어 주세요.
      placeholder: "- [ ] 사용자가 …할 수 있다\n- [ ] …를 확인했다"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 확인 방법
      description: 실행할 명령과 확인할 결과를 적어 주세요.
      placeholder: 실행 명령, 수동 확인 절차 또는 검토할 항목
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서, 화면 또는 이슈가 있으면 링크해 주세요.
    validations:
      required: false
